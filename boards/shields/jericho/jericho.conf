# Jericho V3 - default firmware settings
# Feel free to tune these; nothing here is required for the matrix to work.

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Uncomment if you want a slower/more conservative scan (helps with
# noisy switches or debounce issues while you're bringing the board up):
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
